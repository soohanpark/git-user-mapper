name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance(어느 커밋에서 어떤 워크플로우가 빌드했는지 서명)를 붙이는 데 필요하다.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # engines의 하한. 여기서 통과하면 그 위 줄기도 통과한다.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # 없으면 parity의 zsh 케이스가 전부 skip된 채 초록불이 나온다.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - run: npm ci

      # 태그가 붙었다고 검증을 건너뛰지 않는다. 배포는 되돌리기 가장 비싼 동작이다.
      - run: npm run lint

      - run: npm run typecheck

      # 셸이 없으면 건너뛰는 대신 실패한다. 검증되지 않은 parity로 배포까지 가는 것이
      # 이 관문이 막으려는 일이다.
      - name: Test
        env:
          GIT_MAPPER_REQUIRE_SHELLS: "1"
        run: npm test

      # 태그와 package.json이 어긋나면 v1.1.0 태그로 1.0.0이 배포된다. npm에서는
      # 같은 버전을 다시 올릴 수 없으므로, 그 실수는 되돌릴 방법이 없다.
      - name: The tag must be the version being published
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          echo "tag=$tagged package.json=$declared"
          if [ "$tagged" != "$declared" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${declared}"
            exit 1
          fi

      # prepack이 `npm run build`를 돌리므로 dist/는 여기서 만들어진다.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
