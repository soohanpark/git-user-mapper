name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

# 릴리스 때 처음 CI를 돌리면, 플랫폼 차이를 하필 배포 순간에 발견하게 된다.
# publish.yml과 같은 관문을 평소에도 돌려 둔다.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22는 package.json의 engines 하한(타입 스트리핑이 처음 기본 활성화된 줄기)이고,
        # 24는 개발에 쓰는 줄기다. 둘 다 깨지지 않아야 한다.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # parity 스위트는 설치되지 않은 셸을 조용히 건너뛴다. zsh 없이 돌리면
      # "프롬프트가 git과 같은 답을 낸다"는 주장의 절반이 검증되지 않은 채 초록불이 된다.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # AGENTS.md: 초록불이 곧 "모든 셸을 돌렸다"는 뜻은 아니다. 셸이 없으면 건너뛰는
      # 대신 실패하게 만든다. 플랫폼 조건부 skip(대소문자 구분 파일시스템 등)은 그대로
      # 둔다 — 그건 리눅스에서 실행할 수 없는 게 맞는 테스트다.
      - name: Test
        env:
          GIT_MAPPER_REQUIRE_SHELLS: "1"
        run: npm test
